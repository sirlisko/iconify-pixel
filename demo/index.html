<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iconify-pixel playground</title>
<meta name="description" content="Redraw any Iconify icon as a crisp pixel-art sprite. Tune the grid and threshold live.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23d9480f' d='M1 1h6v1H1zM1 2h1v4H1zM6 2h1v4H6zM1 6h6v1H1zM3 3h2v2H3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
	<h1>iconify-pixel</h1>
	<p>Any <a href="https://iconify.design">Iconify</a> icon, redrawn as a pixel sprite. Same core as the package, rendered here with resvg-wasm.</p>
</header>

<form id="controls" autocomplete="off">
	<fieldset class="source">
		<label>Set <select id="set"></select></label>
		<label>Search all sets <input id="query" type="search" placeholder="mail, rocket, heart…"></label>
	</fieldset>
	<fieldset class="tune">
		<label>Grid <output id="grid-out"></output><input id="grid" type="range" min="8" max="32" step="1" value="16"></label>
		<label>Ink <output id="ink-out"></output><input id="ink" type="range" min="1" max="255" step="1" value="100"></label>
		<label>Supersample <output id="ss-out"></output><input id="ss" type="range" min="2" max="16" step="1" value="12"></label>
		<button type="button" id="reset">Reset</button>
	</fieldset>
</form>

<p id="status" role="status"></p>
<div id="icons" class="grid"></div>
<nav id="pager">
	<button type="button" id="prev">← Prev</button>
	<span id="page"></span>
	<button type="button" id="next">Next →</button>
</nav>

<details id="custom">
	<summary>Try your own SVG</summary>
	<textarea id="svg-input" rows="6" spellcheck="false" placeholder='<svg viewBox="0 0 24 24" …>'></textarea>
	<div id="custom-out" class="grid"></div>
</details>

<dialog id="detail">
	<form method="dialog"><button class="close" aria-label="Close">×</button></form>
	<h2 id="detail-name"></h2>
	<div class="compare">
		<figure><div id="detail-src" class="big"></div><figcaption>original</figcaption></figure>
		<figure><div id="detail-px" class="big"></div><figcaption>sprite</figcaption></figure>
		<figure><div id="detail-overlay" class="big overlay"></div><figcaption>overlay</figcaption></figure>
	</div>
	<div class="scales" id="detail-scales"></div>
	<div class="actions">
		<button type="button" id="copy-svg">Copy SVG</button>
		<button type="button" id="copy-d">Copy path</button>
		<code id="detail-code"></code>
	</div>
</dialog>

<footer>
	<a href="https://github.com/sirlisko/iconify-pixel">GitHub</a> · icon data from the <a href="https://iconify.design/docs/api/">Iconify API</a>
</footer>
<script type="module" src="./main.ts"></script>
</body>
</html>
